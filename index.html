<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Production DevOps WebApp</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f4f7f6;
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }
        .container {
            text-align: center;
            background: white;
            padding: 3rem;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
        }
        h1 { color: #2c3e50; margin-bottom: 1rem; }
        p { color: #7f8c8d; font-size: 1.1rem; }
        .status-badge {
            display: inline-block;
            background-color: #2ecc71;
            color: white;
            padding: 0.5rem 1rem;
            border-radius: 50px;
            font-weight: bold;
            margin-top: 1rem;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>DevOps Pipeline Demo</h1>
        <p>This web application was deployed completely automated using modern DevOps practices.</p>
        <div class="status-badge" id="status">System Status: Online</div>
    </div>

    <script>
        // Simple client-side check that can be targeted by automated tests
        console.log("App initialization successful.");
    </script>
</body>
</html>
